[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reee-sinir-dashboard"
version = "0.1.0"
description = "ETL e dashboard de monitoramento da logística reversa de REEE (SINIR 2019-2025)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1", "xlrd>=2.0", "odfpy>=1.4", "rarfile>=4.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
reee-painel = "reee.servidor:main"
reee-pipeline = "reee.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
